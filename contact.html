<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Juan I. Naranjo Quiroga</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <a href="index.html" class="brand">Juan I. Naranjo Quiroga</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="index.html#about">About</a>
        <a href="resume.pdf" download="Juan-Naranjo-Resume.pdf">Resume</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </header>

    <main class="content">
      <section class="intro">
        <span class="tag">Get in touch</span>
        <h1>Want to connect?</h1>
        <p>Tell me a bit about what you have in mind and I'll get back to you asap.</p>
      </section>

      <div class="contact-wrapper">
        <div class="contact-form">
          <!-- Reemplaza YOUR_FORM_ID con tu ID de https://formspree.io -->
          <form action="https://formspree.io/f/mgaapvpn" method="POST">
            <input type="hidden" name="_subject" value="New message from your website">
            <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">

            <p>
              <label for="fullname">Full name</label>
              <input type="text" id="fullname" name="fullname" required>
            </p>
            <p>
              <label for="email">Email address</label>
              <input type="email" id="email" name="email" required>
            </p>
            <p>
              <label for="phone">Phone number</label>
              <input type="tel" id="phone" name="phone">
            </p>
            <p>
              <label for="affair">Subject</label>
              <input type="text" id="affair" name="affair">
            </p>
            <p class="block">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" required></textarea>
            </p>
            <p class="block">
              <button type="submit">Send message</button>
            </p>
          </form>
        </div>

        <aside class="contact-info">
          <h4>More info</h4>
          <ul>
            <li><span class="dot"></span> Prague, Czech Republic</li>
            <li><span class="dot"></span> <a href="mailto:ignacionaran@gmail.com">ignacionaran@gmail.com</a></li>
            <li><span class="dot"></span> <a href="https://www.linkedin.com/in/jinaranquir/" target="_blank" rel="noopener">LinkedIn</a></li>
          </ul>
          <p class="small">Copyright © 2026 OrangeFyre. All rights reserved.</p>
        </aside>
      </div>
    </main>
  </div>
</body>
</html>
